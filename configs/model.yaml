model:
  name: profit
  target_pred: v
  ae:
    encoder:
      name: bb_af3
      module_type: encoder
      token_dim: 256
      nlayers: 5
      nheads: 8
      residual_mha: true
      residual_transition: true
      parallel_mha_transition: false
      use_attn_pair_bias: true
      strict_feats: false
      feats_init_seq: [chain_break_per_res]
      feats_cond_seq: []
      t_emb_dim: 256
      dim_cond: 256
      idx_emb_dim: 128
      feats_pair_repr: [rel_seq_sep, x1_pair_dists]
      feats_pair_cond: []
      x1_pair_dist_dim: 64
      x1_pair_dist_min: 0.1
      x1_pair_dist_max: 3.0
      seq_sep_dim: 127
      pair_repr_dim: 128
      update_pair_repr: false
      update_pair_repr_every_n: 2
      use_tri_mult: false
      num_registers: 32
      use_qkln: true
      apply_rotary: true
      dropout: 0.0
      sliding_window_size: 0
      dim_latent: 8
      num_buckets_predict_pair: 64
      atom_encoder:
        atom_dim: 64
        atom_dim_pair: 16
        n_queries: 32
        n_keys: 128
        n_layers: 3
        nheads: 4
        apply_rotary: false
    decoder:
      name: bb_af3
      module_type: decoder
      token_dim: 256
      nlayers: 5
      nheads: 8
      residual_mha: true
      residual_transition: true
      parallel_mha_transition: false
      use_attn_pair_bias: true
      strict_feats: false
      feats_init_seq: [chain_break_per_res, x_sc]
      feats_cond_seq: [time_emb]
      t_emb_dim: 256
      dim_cond: 256
      idx_emb_dim: 128
      feats_pair_repr: [rel_seq_sep, x_sc_pair_dists, xt_pair_dists]
      feats_pair_cond: [time_emb]
      xt_pair_dist_dim: 64
      xt_pair_dist_min: 0.1
      xt_pair_dist_max: 3.0
      x_sc_pair_dist_dim: 128
      x_sc_pair_dist_min: 0.1
      x_sc_pair_dist_max: 3.0
      seq_sep_dim: 127
      pair_repr_dim: 128
      update_pair_repr: false
      update_pair_repr_every_n: 2
      use_tri_mult: true
      num_registers: 32
      use_qkln: true
      apply_rotary: true
      dropout: 0.0
      sliding_window_size: 0
      dim_latent: 8
      num_buckets_predict_pair: 64
      atom_encoder:
        atom_dim: 64
        atom_dim_pair: 16
        n_queries: 32
        n_keys: 128
        n_layers: 3
        nheads: 4
        apply_rotary: false
      atom_decoder:
        atom_dim: 64
        atom_dim_pair: 16
        n_queries: 32
        n_keys: 128
        n_layers: 3
        nheads: 4
        apply_rotary: false
    vq:
      codebook_size: 8192
      decay: 0.99
      eps: 1.0e-5
      commitment_loss_weight: 0.0
      use_cosine_sim: false
      kmeans_init: false
      kmeans_iters: 10
      sync_kmeans: true
      force_quantization_f32: true
      threshold_ema_dead_code: 2.0
      expired_code_reset_size: null
loss:
  t_distribution:
    name: mix_up02_beta
    p1: 1.9
    p2: 1.0
training:
  noise_tau: 0.0
  token_noise_ratio: 0.1
opt:
  lr: 1.0e-4
